<div class="pagination" th:if="${totalPaginas > 1}">
  <a th:if="${paginaActual > 0}" th:href="${urlBase + (paginaActual - 1)}" class="pagination-btn">&larr; Anterior</a>
  <span th:unless="${paginaActual > 0}" class="pagination-btn pagination-disabled">&larr; Anterior</span>

  <div class="pagination-numeros">
    <th:block th:each="pagina : ${#numbers.sequence(0, totalPaginas - 1)}">
      <a th:if="${pagina == 0 or pagina == totalPaginas - 1 or (pagina >= paginaActual - 2 and pagina <= paginaActual + 2)}"
         th:href="${urlBase + pagina}"
         th:text="${pagina + 1}"
         th:classappend="${pagina == paginaActual} ? ' pagination-num-actual' : ''"
         class="pagination-num"></a>
      <span th:if="${pagina == paginaActual - 3 and pagina > 0}" class="pagination-ellipsis">&hellip;</span>
      <span th:if="${pagina == paginaActual + 3 and pagina < totalPaginas - 1}" class="pagination-ellipsis">&hellip;</span>
    </th:block>
  </div>

  <span class="pagination-info" th:text="'Página ' + (${paginaActual} + 1) + ' de ' + ${totalPaginas}"></span>

  <a th:if="${paginaActual + 1 < totalPaginas}" th:href="${urlBase + (paginaActual + 1)}" class="pagination-btn">Siguiente &rarr;</a>
  <span th:unless="${paginaActual + 1 < totalPaginas}" class="pagination-btn pagination-disabled">Siguiente &rarr;</span>
</div>
