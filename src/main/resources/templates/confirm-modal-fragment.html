<div class="modal-overlay hidden" id="confirm-modal-overlay" th:fragment="confirmModal">
  <div class="modal-confirm">
    <h3 id="confirm-modal-titulo">¿Eliminar este elemento?</h3>
    <p id="confirm-modal-texto">Esta acción no se puede deshacer.</p>
    <div class="modal-confirm-actions">
      <button type="button" id="confirm-modal-cancelar">Cancelar</button>
      <button type="button" id="confirm-modal-confirmar">Eliminar</button>
    </div>
  </div>
</div>
