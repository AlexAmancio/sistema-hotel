<!DOCTYPE html>
<html lang="es">
  <head th:replace="~{header-fragment :: headertag(title=${titulo})}">
  <body>
    <div th:replace="~{navegacion :: menu}"></div>
    <div class="content">
      <form th:action="@{/clientes/guardar/}" method="post" th:object="${cliente}">
        <div class="header-form">
          <h1 th:text="${titulo}"></h1>
        </div>
        <div class="content-form">
          <input th:field="*{id}" type="hidden" />
          <div class="group-field">
            <label for="identificacion">Identificación</label>
            <input th:field="*{identificacion}" type="text" id="identificacion" required>
            <button type="button" class="btn btnbusqueda" id="busqueda">Buscar
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="bi bi-search" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
              </svg>
            </button>
          </div>
          <div class="group-field">
            <label for="nombres">Nombres</label>
            <input th:field=*{nombres} type="text" autofocus id="nombres" readonly="">
          </div>
          <div class="group-field">
            <label for="apellidos">Apellidos</label>
            <input th:field="*{apellidos}" type="text" id="apellidos" readonly="">
          </div>
          <div class="group-field">
            <label for="pais">Pais</label>
            <input th:field="*{pais}" type="text">
          </div>
          <div class="group-field">
            <label for="ciudad">Ciudad</label>
            <input th:field="*{ciudad}" type="text">
          </div>
          <div class="group-field">
            <label for="telefono">Telefono</label>
            <input th:field="*{telefono}" type="text">
          </div>
          <div class="group-field">
            <label for="correo">Correo</label>
            <input th:field="*{correo}" type="text">
          </div>
          <div class="group-field">
            <label for="ocupacion">Ocupación</label>
            <input th:field="*{ocupacion}" type="text">
          </div>
        </div>
        <div class="actions-form">
          <button type="submit">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M10.9091 1.53409C10.9091 1.30805 10.8193 1.09128 10.6595 0.931443C10.4996 0.771611 10.2829 0.681818 10.0568 0.681818C9.83079 0.681818 9.61401 0.771611 9.45418 0.931443C9.29434 1.09128 9.20455 1.30805 9.20455 1.53409V9.20455H1.5341C1.30806 9.20455 1.09128 9.29434 0.931449 9.45417C0.771617 9.614 0.681824 9.83078 0.681824 10.0568C0.681824 10.2829 0.771617 10.4996 0.931449 10.6595C1.09128 10.8193 1.30806 10.9091 1.5341 10.9091H9.20455V18.5795C9.20455 18.8056 9.29434 19.0224 9.45418 19.1822C9.61401 19.342 9.83079 19.4318 10.0568 19.4318C10.2829 19.4318 10.4996 19.342 10.6595 19.1822C10.8193 19.0224 10.9091 18.8056 10.9091 18.5795V10.9091H18.5796C18.8056 10.9091 19.0224 10.8193 19.1822 10.6595C19.342 10.4996 19.4318 10.2829 19.4318 10.0568C19.4318 9.83078 19.342 9.614 19.1822 9.45417C19.0224 9.29434 18.8056 9.20455 18.5796 9.20455H10.9091V1.53409Z"
                fill="black" />
            </svg>
            <span th:text="${txtboton}"></span>
          </button>
          <button id="btn-close"><span>Cancelar</span></button>
        </div>

      </form>

      <div th:if="${historial != null and !historial.isEmpty()}" style="max-width: 900px; margin: 40px auto 0;">
        <h3 style="margin-bottom: 14px;">Historial de reservas</h3>
        <div class="table-wrapper">
          <table>
            <tr class="table-header">
              <th>Habitación</th>
              <th>Check-in</th>
              <th>Estado</th>
              <th>Total</th>
              <th>Saldo</th>
            </tr>
            <tr class="table-item" th:each="registro : ${historial}">
              <td>
                <a th:href="${'/editar/' + registro.id + '/'}"
                   th:text="${registro.habitacion != null ? ('Hab. ' + registro.habitacion.numero) : '—'}"></a>
              </td>
              <td th:text="${#dates.format(registro.checkIn, 'dd/MM/yyyy HH:mm')}"></td>
              <td>
                <span class="col-tag estado-activa" th:if="${registro.estado.name() == 'ACTIVA'}">Activa</span>
                <span class="col-tag estado-finalizada" th:if="${registro.estado.name() == 'FINALIZADA'}">Check-out hecho</span>
                <span class="col-tag estado-cancelada" th:if="${registro.estado.name() == 'CANCELADA'}">Cancelada</span>
                <span class="col-tag estado-no-show" th:if="${registro.estado.name() == 'NO_SHOW'}">No-show</span>
              </td>
              <td th:text="${'S/. ' + #numbers.formatDecimal(registro.totalEstadia, 1, 2)}"></td>
              <td>
                <span th:if="${registro.saldoPendiente > 0}" class="saldo-pendiente" th:text="${'S/. ' + #numbers.formatDecimal(registro.saldoPendiente, 1, 2)}"></span>
                <span th:unless="${registro.saldoPendiente > 0}" class="saldo-cero">Pagado</span>
              </td>
            </tr>
          </table>
        </div>
      </div>
      <p th:if="${historial != null and historial.isEmpty()}" style="max-width: 900px; margin: 40px auto 0; color: var(--color-plomo-oscuro);">
        Este cliente todavía no tiene reservas registradas.
      </p>
    </div>
    <script th:src="@{/js/script.js}"></script>
    <script th:src="@{/js/script-forms.js}"></script>
    <script th:src="@{/js/script-apidni.js}"></script>
  </body>

</html>
