<!DOCTYPE html>
<html lang="es">
<head th:replace="~{header-fragment :: headertag(title=${titulo})}">
</head>
<body>
<div th:replace="~{navegacion :: menu}"></div>
<div class="content">
    <form th:action="@{/guardar/}" method="post" th:object="${registro}">
        <div class="header-form">
            <h1 th:text="${titulo}"></h1>
        </div>
        <div class="content-form">
            <div th:if="${error}" class="alert alert-danger">
                <p th:text="${error}"></p>
            </div>
            <input th:field="*{id}" type="hidden" />
            <input th:field="*{version}" type="hidden" />
            <div class="group-field">
                <label for="cliente">Cliente</label>
                <select th:field="*{cliente}">
                    <option th:each="cliente : ${listaClientes}" th:value="${cliente.id}" th:text="${cliente.nombres + ' ' + cliente.apellidos}"></option>
                </select>
            </div>
            <div class="group-field">
                <label for="checkIn">Fecha de ingreso:</label>
                <input th:field="*{checkIn}" type="datetime-local" required/>
            </div>
            <div class="group-field">
                <label for="noches">N° Noches:</label>
                <input id="noches" th:field="*{noches}" type="number" required min="1"/>
                <button type="button" class="btn btnbusqueda" id="busqueda">Buscar
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="bi bi-search" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                    </svg>
                </button>
            </div>
            <div class="group-field hidden" id="habitacion-group">
                <label for="habitacion">Habitación</label>
                <select id="habitacion" th:field="*{habitacion}">
                    <option th:each="habitacion : ${listaHabitaciones}" th:value="${habitacion.id}" th:attr="data-aforo=${habitacion.aforo}" th:text="${'Habitación ' + habitacion.numero + ' (aforo ' + habitacion.aforo + ')'}"></option>
                </select>
            </div>
            <div class="group-field">
                <label for="tarifa">Tarifa (en soles):</label>
                <input id="tarifaCalculada" th:field="*{tarifa}" type="number" readonly/>
                <button type="button" class="btn btnbusqueda" id="calcularTarifa">Calcular
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calculator" viewBox="0 0 16 16">
                    <path d="M12 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                    <path d="M4 2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z"/>
                  </svg>
                </button>

            </div>
            <div class="group-field">
                <label for="numHuespedes">N° Huéspedes:</label>
                <input id="numHuespedes" th:field="*{numHuespedes}" type="number" min="1"/>
            </div>
            <p id="aforo-warning" class="hidden" style="color: var(--color-rojo); margin: -8px 0 12px 250px;">
                Supera el aforo máximo de la habitación seleccionada.
            </p>
            <div class="group-field">
                <label for="observaciones">Observaciones:</label>
                <input th:field="*{observaciones}" type="text"/>
            </div>
            <div class="group-field">
                <label for="metodoPago">Método de pago</label>
                <select th:field="*{metodoPago}">
                    <option value="">— Sin definir —</option>
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TARJETA">Tarjeta</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                </select>
            </div>
            <div class="group-field">
                <label for="montoPagado">Monto pagado (S/.)</label>
                <input th:field="*{montoPagado}" type="number" min="0" step="0.1"/>
            </div>
            <div class="group-field">
                <label for="usuario">Usuario</label>
                <select th:field="*{usuario}">
                    <option th:each="usuario : ${listaUsuarios}" th:value="${usuario.id}" th:text="${usuario.nombres + ' ' + usuario.apellidos}"></option>
                </select>
            </div>
            <div class="actions-form">
                <button type="submit">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                                d="M10.9091 1.53409C10.9091 1.30805 10.8193 1.09128 10.6595 0.931443C10.4996 0.771611 10.2829 0.681818 10.0568 0.681818C9.83079 0.681818 9.61401 0.771611 9.45418 0.931443C9.29434 1.09128 9.20455 1.30805 9.20455 1.53409V9.20455H1.5341C1.30806 9.20455 1.09128 9.29434 0.931449 9.45417C0.771617 9.614 0.681824 9.83078 0.681824 10.0568C0.681824 10.2829 0.771617 10.4996 0.931449 10.6595C1.09128 10.8193 1.30806 10.9091 1.5341 10.9091H9.20455V18.5795C9.20455 18.8056 9.29434 19.0224 9.45418 19.1822C9.61401 19.342 9.83079 19.4318 10.0568 19.4318C10.2829 19.4318 10.4996 19.342 10.6595 19.1822C10.8193 19.0224 10.9091 18.8056 10.9091 18.5795V10.9091H18.5796C18.8056 10.9091 19.0224 10.8193 19.1822 10.6595C19.342 10.4996 19.4318 10.2829 19.4318 10.0568C19.4318 9.83078 19.342 9.614 19.1822 9.45417C19.0224 9.29434 18.8056 9.20455 18.5796 9.20455H10.9091V1.53409Z"
                                fill="black"/>
                    </svg>
                    <span th:text="${txtboton}"></span>
                </button>
                <button id="btn-close"><span>Cancelar</span></button>
            </div>
        </div>
    </form>
</div>
<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/script-forms.js}"></script>
<script>
    document.getElementById("busqueda").addEventListener("click", function() {
        const checkIn = document.querySelector('input[name="checkIn"]').value;
        const noches = document.querySelector('input[name="noches"]').value;

        fetch(`/habitaciones/disponibles?checkIn=${checkIn}&noches=${noches}`)
            .then(response => response.json())
            .then(data => {
                const habitacionSelect = document.querySelector('select[name="habitacion"]');
                habitacionSelect.innerHTML = "";

                data.forEach(habitacion => {
                    const option = document.createElement("option");
                    option.value = habitacion.id;
                    option.dataset.aforo = habitacion.aforo;
                    option.textContent = `Habitación ${habitacion.numero} (aforo ${habitacion.aforo})`;
                    habitacionSelect.appendChild(option);
                });

                document.getElementById('habitacion-group').classList.remove('hidden');
                verificarAforo();
            })
            .catch(error => console.error('Error al obtener las habitaciones disponibles:', error));
    });

    function verificarAforo() {
        const habitacionSelect = document.getElementById('habitacion');
        const numHuespedesInput = document.getElementById('numHuespedes');
        const warning = document.getElementById('aforo-warning');

        const opcionSeleccionada = habitacionSelect.options[habitacionSelect.selectedIndex];
        const aforo = opcionSeleccionada ? parseInt(opcionSeleccionada.dataset.aforo, 10) : null;
        const huespedes = parseInt(numHuespedesInput.value, 10);

        if (aforo && huespedes > aforo) {
            warning.classList.remove('hidden');
        } else {
            warning.classList.add('hidden');
        }
    }

    document.getElementById('numHuespedes').addEventListener('input', verificarAforo);
    document.getElementById('habitacion').addEventListener('change', verificarAforo);
</script>
<script>
document.getElementById("calcularTarifa").addEventListener("click", function () {
    // Busca el elemento select de habitaciones y obtén el valor seleccionado (ID de la habitación)
    const habitacionSelect = document.getElementById('habitacion');
    const habitacionID = habitacionSelect.value;

    const noches = document.querySelector('input[name="noches"]').value;
    const checkIn = document.querySelector('input[name="checkIn"]').value;

    fetch(`/habitaciones/calcular-tarifa/${habitacionID}?noches=${noches}&checkIn=${encodeURIComponent(checkIn)}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('tarifaCalculada').value = data;
        })
        .catch(error => console.error('Error al calcular tarifa:', error));
});
</script>
</body>
</html>
