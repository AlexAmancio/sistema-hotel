<!DOCTYPE html>
<html lang="es">

<head th:replace="~{header-fragment :: headertag(title='Extender estadía')}">

<body>
  <div th:replace="~{navegacion :: menu}"></div>
  <div class="content">
    <form th:action="${'/extender/' + registro.id + '/'}" method="post">
      <div class="header-form">
        <h1>Extender estadía</h1>
      </div>
      <div class="content-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="group-field">
          <label>Cliente</label>
          <input type="text" th:value="${registro.cliente.nombres + ' ' + registro.cliente.apellidos}" readonly>
        </div>
        <div class="group-field">
          <label>Habitación</label>
          <input type="text" th:value="${'Hab. ' + registro.habitacion.numero}" readonly>
        </div>
        <div class="group-field">
          <label>Fecha de ingreso</label>
          <input type="text" th:value="${#dates.format(registro.checkIn, 'dd/MM/yyyy HH:mm')}" readonly>
        </div>
        <div class="group-field">
          <label for="noches">N° de noches</label>
          <input id="noches" name="noches" type="number" min="1" th:value="${registro.noches}" required>
        </div>
        <div class="group-field">
          <label>Nuevo checkout estimado</label>
          <input id="nuevo-checkout" type="text" readonly>
        </div>
      </div>
      <div class="actions-form">
        <button type="submit">
          <span>Guardar extensión</span>
        </button>
        <button id="btn-close"><span>Cancelar</span></button>
      </div>
    </form>
  </div>
  <script th:src="@{/js/script.js}"></script>
  <script th:src="@{/js/script-forms.js}"></script>
  <script th:inline="javascript">
    const checkInMillis = /*[[${registro.checkIn.time}]]*/ 0;

    function actualizarPreview() {
        const noches = parseInt(document.getElementById('noches').value, 10) || 0;
        const checkout = new Date(checkInMillis);
        checkout.setDate(checkout.getDate() + noches);
        checkout.setHours(12, 0, 0, 0);
        document.getElementById('nuevo-checkout').value = checkout.toLocaleString('es-PE');
    }

    document.getElementById('noches').addEventListener('input', actualizarPreview);
    actualizarPreview();
  </script>
</body>

</html>
