<!DOCTYPE html>
<html lang="es">

<head th:replace="~{header-fragment :: headertag(title='Registros del hotel')}">

<body>
  <div th:replace="~{navegacion :: menu}"></div>

  <div class="content">
    <div style="display:flex; column-gap: 16px; flex-wrap: wrap;">
      <div th:replace="~{button-fragment(url=@{/nuevo/}, texto='Agregar reserva')}"></div>
      <div th:replace="~{button-fragment(url=@{/reservas/nueva/}, texto='Reserva múltiple')}"></div>
    </div>

    <div class="filtro-bar">
      <form method="get" th:action="@{/}" id="filtro-estado-form">
        <label for="filtro-estado">Estado:</label>
        <select id="filtro-estado" name="estado" onchange="document.getElementById('filtro-estado-form').submit()">
          <option value="" th:selected="${estadoSeleccionado == ''}">Todos</option>
          <option value="ACTIVA" th:selected="${estadoSeleccionado == 'ACTIVA'}">Activa</option>
          <option value="FINALIZADA" th:selected="${estadoSeleccionado == 'FINALIZADA'}">Check-out hecho</option>
          <option value="CANCELADA" th:selected="${estadoSeleccionado == 'CANCELADA'}">Cancelado</option>
          <option value="NO_SHOW" th:selected="${estadoSeleccionado == 'NO_SHOW'}">No-show</option>
        </select>
        <input type="text" id="filtro-busqueda" name="q" placeholder="Buscar cliente, DNI o habitación..."
               autocomplete="off" th:value="${busqueda}" />
      </form>
      <a class="btn-exportar" th:href="@{/exportar/(estado=${estadoSeleccionado}, q=${busqueda})}">Exportar CSV</a>
    </div>

    <div class="table-wrapper">
    <table class="table-registros">
      <tr class="table-header">
        <th>Descripción</th>
        <th>Estadía</th>
        <th>Estado</th>
        <th>Tarifa</th>
        <th>Saldo</th>
        <th>Observaciones</th>
        <th></th>
      </tr>
      <tr th:each="registro : ${registros}" class="table-item"
          th:classappend="${registro.estado.name() == 'ACTIVA' and registro.calcularCheckoutEstimadoAmigable().equals('Vencido')} ? 'table-item-vencido'">
        <td class="table-item-header">
          <a th:href="${'/editar/' + registro.id + '/'}">
            <div class="cliente-item-header">
              <h3 th:text="${registro.cliente.nombres + ' en Hab.' + registro.habitacion.numero}"></h3>

              <div class="cliente-item-meta">
                <span th:text="${'Huespedes ' + registro.numHuespedes}"></span>
                <span th:if="${registro.reserva != null}" class="col-tag tag-reserva"
                      th:text="${'Reserva #' + registro.reserva.id}"></span>
                <span th:if="${registro.usuario != null}"
                      th:text="${'Registrado por ' + registro.usuario.nombres}"></span>
              </div>
            </div>
          </a>
        </td>
        <td class="col-estadia">
          <div th:text="${'Ingreso ' + #dates.format(registro.checkIn, 'dd/MM/yyyy HH:mm')}"></div>
          <div class="col-estadia-checkout">
            <span th:text="${'Hasta ' + #dates.format(registro.calcularCheckoutEstimado(), 'dd/MM/yyyy HH:mm')}"></span>
            <span
                  th:if="${registro.estado.name() == 'ACTIVA' and registro.calcularCheckoutEstimadoAmigable().equals('Vencido')}"
                  class="col-tag tag-vencido"
                  th:text="${registro.calcularCheckoutEstimadoAmigable()}">
                </span>
                <span
                  th:if="${registro.estado.name() == 'ACTIVA' and !registro.calcularCheckoutEstimadoAmigable().equals('Vencido')}"
                  class="col-tag tag-activo"
                  th:text="${registro.calcularCheckoutEstimadoAmigable()}">
                </span>
          </div>
        </td>
        <td>
          <span class="col-tag estado-activa" th:if="${registro.estado.name() == 'ACTIVA'}">Activa</span>
          <span class="col-tag estado-finalizada" th:if="${registro.estado.name() == 'FINALIZADA'}">Check-out hecho</span>
          <span class="col-tag estado-cancelada" th:if="${registro.estado.name() == 'CANCELADA'}">Cancelado</span>
          <span class="col-tag estado-no-show" th:if="${registro.estado.name() == 'NO_SHOW'}">No-show</span>
        </td>
        <td th:text="${'S/. ' + #numbers.formatDecimal(registro.tarifa, 1, 2)}"></td>
        <td>
          <span th:if="${registro.saldoPendiente > 0}" class="saldo-pendiente" th:text="${'S/.' + #numbers.formatDecimal(registro.saldoPendiente, 1, 2)}"></span>
          <span th:unless="${registro.saldoPendiente > 0}" class="saldo-cero">Pagado</span>
        </td>
        <td class="col-observaciones" th:text="${registro.observaciones}"></td>
        <td>
          <div class="acciones-fila">
          <form th:if="${registro.estado.name() == 'ACTIVA'}" class="form-eliminar"
                th:action="${'/checkout/' + registro.id + '/'}" method="post"
                data-confirm-titulo="¿Hacer check-out?"
                th:attr="data-confirm-texto=${registro.saldoPendiente > 0
                            ? ('Ojo: queda un saldo pendiente de S/. ' + #numbers.formatDecimal(registro.saldoPendiente, 1, 2) + ' sin cobrar. Si hacés check-out ahora, va a quedar sin cobrar. ¿Confirmás igual?')
                            : 'La habitación quedará marcada En limpieza y disponible para un próximo huésped.'},
                        data-confirm-peligro=${registro.saldoPendiente > 0},
                        data-confirm-link-href=${registro.saldoPendiente > 0 ? ('/editar/' + registro.id + '/') : null},
                        data-confirm-link-texto=${registro.saldoPendiente > 0 ? 'Ir a cobrar el saldo primero →' : null}"
                data-confirm-boton="Hacer check-out">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-checkout-rapido">Check-out</button>
          </form>
          <div class="wrapper-options">
            <div class="icon-three">
              <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M17.8325 13.2894C17.5975 13.2895 17.3647 13.2433 17.1475 13.1534C16.9303 13.0635 16.7329 12.9317 16.5667 12.7655C16.4004 12.5994 16.2685 12.4021 16.1785 12.185C16.0884 11.9678 16.0421 11.7351 16.042 11.5C16.0419 11.2649 16.0881 11.0322 16.178 10.815C16.2679 10.5978 16.3997 10.4004 16.5659 10.2341C16.732 10.0679 16.9293 9.93595 17.1464 9.84592C17.3636 9.7559 17.5963 9.70953 17.8314 9.70945C18.3061 9.7093 18.7615 9.89774 19.0973 10.2333C19.4331 10.5689 19.6218 11.0241 19.6219 11.4988C19.6221 11.9736 19.4337 12.4289 19.0981 12.7647C18.7625 13.1005 18.3073 13.2892 17.8325 13.2894Z"
                  fill="black" />
                <path
                  d="M11.6893 13.2894C12.6776 13.2894 13.4787 12.4883 13.4787 11.5C13.4787 10.5117 12.6776 9.7106 11.6893 9.7106C10.701 9.7106 9.8999 10.5117 9.8999 11.5C9.8999 12.4883 10.701 13.2894 11.6893 13.2894Z"
                  fill="black" />
                <path
                  d="M5.54477 13.2896C6.53303 13.2896 7.33417 12.4885 7.33417 11.5002C7.33417 10.512 6.53303 9.71085 5.54477 9.71085C4.55651 9.71085 3.75537 10.512 3.75537 11.5002C3.75537 12.4885 4.55651 13.2896 5.54477 13.2896Z"
                  fill="black" />
              </svg>
            </div>
            <div class="submenu-options">
              <ul>
                <a th:href="${'/editar/' + registro.id + '/'}">
                  <li>
                    <img th:src="@{/icons/edit-outline.svg}" alt="Icono de editar">
                    <span>Editar</span>
                  </li>
                </a>

                <a th:if="${registro.estado.name() == 'ACTIVA'}" th:href="${'/extender/' + registro.id + '/'}">
                  <li>
                    <img th:src="@{/icons/edit-outline.svg}" alt="Icono de extender">
                    <span>Extender estadía</span>
                  </li>
                </a>

                <a th:if="${registro.estado.name() == 'ACTIVA' or registro.estado.name() == 'FINALIZADA'}"
                   th:href="${'/consumos/' + registro.id + '/'}">
                  <li>
                    <img th:src="@{/icons/edit-outline.svg}" alt="Icono de consumos">
                    <span th:text="${registro.totalConsumos > 0 ? ('Consumos (S/.' + #numbers.formatDecimal(registro.totalConsumos, 1, 2) + ')') : 'Consumos'}"></span>
                  </li>
                </a>

                <div th:if="${!comprobantes.containsKey(registro.id) and registro.estado.name() == 'FINALIZADA'}">
                  <form class="form-eliminar" th:action="${'/comprobantes/emitir/' + registro.id + '/'}" method="post"
                        data-confirm-titulo="¿Emitir comprobante?"
                        data-confirm-texto="Se genera un comprobante local de demostración (no válido ante SUNAT) con número correlativo fijo."
                        data-confirm-boton="Emitir">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit">
                      <li>
                        <img th:src="@{/icons/edit-outline.svg}" alt="Icono de factura">
                        <span>Emitir comprobante</span>
                      </li>
                    </button>
                  </form>
                </div>
                <a th:if="${comprobantes.containsKey(registro.id)}" th:href="${'/comprobantes/ver/' + registro.id + '/'}">
                  <li>
                    <img th:src="@{/icons/edit-outline.svg}" alt="Icono de factura">
                    <span th:text="${'Ver comprobante ' + comprobantes.get(registro.id).numeroCompleto}"></span>
                  </li>
                </a>

                <li class="submenu-separador">Terminar o cancelar</li>

                <form th:if="${registro.estado.name() == 'ACTIVA' and registro.totalConsumos == 0}" class="form-eliminar"
                      th:action="${'/cancelar/' + registro.id + '/'}" method="post"
                      data-confirm-titulo="¿Cancelar esta reserva?"
                      data-confirm-texto="Queda marcado como cancelado, sin borrar el historial. Si la habitación ya estaba ocupada, pasa por limpieza antes de liberarse; si no, queda disponible al instante."
                      data-confirm-boton="Cancelar reserva">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <button type="submit">
                    <li>
                      <img th:src="@{/icons/delete-outline.svg}" alt="Icono de cancelar">
                      <span>Cancelar reserva</span>
                    </li>
                  </button>
                </form>

                <form th:if="${registro.estado.name() == 'ACTIVA' and registro.totalConsumos == 0}" class="form-eliminar"
                      th:action="${'/no-show/' + registro.id + '/'}" method="post"
                      data-confirm-titulo="¿Marcar como no-show?"
                      data-confirm-texto="El huésped nunca llegó. Queda registrado sin borrar el historial, y libera la habitación."
                      data-confirm-boton="Marcar no-show">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <button type="submit">
                    <li>
                      <img th:src="@{/icons/delete-outline.svg}" alt="Icono de no-show">
                      <span>Marcar no-show</span>
                    </li>
                  </button>
                </form>

                <form class="form-eliminar" th:action="${'/eliminar/' + registro.id + '/'}" method="post"
                      data-confirm-titulo="¿Eliminar este registro?"
                      data-confirm-texto="Se borra por completo de la base de datos — a diferencia de Cancelar o Check-out, acá no queda historial. Si la habitación estaba ocupada por este registro, se libera."
                      data-confirm-peligro="true"
                      data-confirm-boton="Eliminar registro">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <button type="submit">
                    <li class="submenu-eliminar">
                      <img th:src="@{/icons/delete-outline.svg}" alt="Icono de tacho">
                      <span>Eliminar</span>
                    </li>
                  </button>
                </form>
              </ul>
            </div>
          </div>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(registros)}">
        <td colspan="7" style="text-align:center; color: var(--color-plomo-oscuro); padding: 30px 0;">
          No hay registros con este filtro.
        </td>
      </tr>
    </table>
    </div>

    <div th:replace="~{pagination-fragment(paginaActual=${paginaActual}, totalPaginas=${totalPaginas}, urlBase='/?estado=' + ${estadoSeleccionado} + '&amp;q=' + ${busqueda} + '&amp;pagina=')}"></div>

  </div>
  <div th:replace="~{confirm-modal-fragment :: confirmModal}"></div>
  <script th:src="@{/js/script.js}"></script>
  <script th:src="@{/js/script-listas.js}"></script>
  <script th:src="@{/js/script-confirm-delete.js}"></script>
  <script>
    // Busca a medida que se escribe, con una pequeña espera para no mandar
    // un request por cada tecla — igual que el patrón que ya usa el
    // formulario de registro para buscar habitaciones disponibles.
    (function () {
      const input = document.getElementById('filtro-busqueda');
      const form = document.getElementById('filtro-estado-form');
      let busquedaTimeout = null;
      input.addEventListener('input', function () {
        clearTimeout(busquedaTimeout);
        busquedaTimeout = setTimeout(function () {
          form.submit();
        }, 500);
      });
    })();
  </script>
</body>

</html>
