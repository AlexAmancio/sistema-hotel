<!DOCTYPE html>
<html lang="es">

<head th:replace="~{header-fragment :: headertag(title='Mi cuenta')}">

<body>
  <div th:replace="~{navegacion :: menu}"></div>
  <main class="content">
    <div class="perfil-contenido">
      <h1>Mi cuenta</h1>

      <section class="perfil-tarjeta perfil-identidad" aria-labelledby="perfil-nombre">
        <div class="user-avatar" aria-hidden="true">
          <span th:text="${#strings.substring(usuarioActualNombre, 0, 1)}"></span>
          <span th:unless="${#strings.isEmpty(#strings.trim(usuario.apellidos))}"
                th:text="${#strings.substring(#strings.trim(usuario.apellidos), 0, 1)}"></span>
        </div>
        <div>
          <h2 id="perfil-nombre" th:text="${usuario.nombres + ' ' + usuario.apellidos}"></h2>
          <p th:text="${'@' + usuario.username}"></p>
          <p th:text="${usuario.correo}"></p>
        </div>
      </section>

      <section class="perfil-tarjeta" aria-labelledby="perfil-contrasena">
        <h2 id="perfil-contrasena">Cambiar contraseña</h2>
        <form class="perfil-formulario" th:action="@{/perfil/cambiar-contrasena/}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="group-field">
            <label for="actual">Contraseña actual</label>
            <div class="perfil-campo">
              <input type="password" id="actual" name="actual" autocomplete="current-password" required>
              <button type="button" aria-controls="actual" aria-label="Mostrar contraseña actual">Mostrar</button>
            </div>
          </div>
          <div class="group-field">
            <label for="nueva">Nueva contraseña</label>
            <div class="perfil-campo">
              <input type="password" id="nueva" name="nueva" autocomplete="new-password" required>
              <button type="button" aria-controls="nueva" aria-label="Mostrar nueva contraseña">Mostrar</button>
            </div>
          </div>
          <div class="group-field">
            <label for="confirmar">Confirmar nueva contraseña</label>
            <div class="perfil-campo">
              <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required>
              <button type="button" aria-controls="confirmar" aria-label="Mostrar confirmación de nueva contraseña">Mostrar</button>
            </div>
          </div>
          <div class="actions-form">
            <button type="submit">Actualizar contraseña</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script th:src="@{/js/script.js}"></script>
  <script>
    document.querySelectorAll('.perfil-campo button').forEach((button) => {
      const input = document.getElementById(button.getAttribute('aria-controls'));
      const showLabel = button.getAttribute('aria-label');

      button.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.textContent = show ? 'Ocultar' : 'Mostrar';
        button.setAttribute('aria-label', show ? showLabel.replace('Mostrar', 'Ocultar') : showLabel);
      });
    });
  </script>
</body>

</html>
