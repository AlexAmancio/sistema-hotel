<!DOCTYPE html>
<html lang="es">

<head th:replace="~{header-fragment :: headertag(title='Ocupación')}">

<body>
  <div th:replace="~{navegacion :: menu}"></div>
  <div class="content">
    <div class="ocupacion-header">
      <h1>Ocupación</h1>
      <div class="ocupacion-nav">
        <a class="btn-exportar" th:href="@{/ocupacion/(desde=${desdeAnterior})}">&larr; Anterior</a>
        <a class="btn-exportar" th:href="@{/ocupacion/(desde=${desdeHoy})}">Hoy</a>
        <a class="btn-exportar" th:href="@{/ocupacion/(desde=${desdeSiguiente})}">Siguiente &rarr;</a>
      </div>
    </div>

    <div class="ocupacion-wrapper">
      <div class="ocupacion-grid" th:style="'grid-template-columns: 180px repeat(' + ${#lists.size(dias)} + ', minmax(64px, 1fr));'">

        <div class="ocupacion-celda ocupacion-esquina"></div>
        <div class="ocupacion-celda ocupacion-dia-header"
             th:each="dia : ${dias}"
             th:classappend="${dia.time == hoy.time} ? ' ocupacion-dia-hoy'"
             th:text="${#dates.format(dia, 'dd/MM')}"></div>

        <th:block th:each="fila : ${filas}">
          <div class="ocupacion-celda ocupacion-habitacion">
            <b th:text="${'Hab. ' + fila.habitacion.numero}"></b>
            <span th:text="${fila.habitacion.categoria != null ? fila.habitacion.categoria.nombre : ''}"></span>
          </div>
          <div class="ocupacion-fila-dias"
               th:style="'grid-column: 2 / span ' + ${#lists.size(dias)} + '; grid-template-columns: repeat(' + ${#lists.size(dias)} + ', minmax(64px, 1fr));'">
            <a th:each="dia, iter : ${dias}"
               class="ocupacion-dia-vacio"
               th:style="'grid-row: 1; grid-column: ' + (${iter.index} + 1) + ';'"
               th:href="@{/nuevo/(habitacion=${fila.habitacion.id}, checkIn=${#dates.format(dia, 'yyyy-MM-dd') + 'T12:00'})}"
               title="Crear una reserva este día">
            </a>
            <a th:each="bloque : ${fila.bloques}"
               class="ocupacion-bloque"
               th:classappend="${bloque.registro.estado.name() == 'FINALIZADA'} ? ' ocupacion-bloque-finalizada'"
               th:style="'grid-row: 1; grid-column: ' + (${bloque.colInicio} + 1) + ' / span ' + ${bloque.span} + ';'"
               th:href="${'/editar/' + bloque.registro.id + '/'}"
               th:title="${bloque.registro.cliente.nombres + ' ' + bloque.registro.cliente.apellidos + ' — ' + #dates.format(bloque.registro.checkIn, 'dd/MM') + ' (' + bloque.registro.noches + ' noches)'}"
               th:text="${bloque.registro.cliente.apellidos}">
            </a>
          </div>
        </th:block>

      </div>
      <p th:if="${#lists.isEmpty(filas)}" class="hoy-vacio">No hay habitaciones registradas.</p>
    </div>

    <div class="ocupacion-leyenda">
      <span><span class="ocupacion-swatch"></span> Activa</span>
      <span><span class="ocupacion-swatch ocupacion-swatch-finalizada"></span> Check-out hecho</span>
    </div>
  </div>
  <script th:src="@{/js/script.js}"></script>
</body>

</html>
