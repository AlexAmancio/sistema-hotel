server.port=8090
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/alquiler
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

security.login.maxAttempts=3
security.login.lockTimeMinutes=5

# Token de apiperu.dev para el autocompletado de datos por DNI.
# Se resuelve del servidor (nunca se expone al navegador). Puede sobreescribirse
# con la variable de entorno APIPERU_TOKEN en un despliegue real.
apiperu.token=${APIPERU_TOKEN:1feb03952c58153aeaadc14a37d05897db04a0a50ef2c8567199cecc8842a295}

# Correo para "olvidé mi contraseña" (SMTP de Gmail con contraseña de aplicación).
# MAIL_USERNAME/MAIL_PASSWORD se setean como variables de entorno, nunca en este archivo.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Vigencia del enlace de recuperación de contraseña y URL base para armarlo.
security.reset.tokenExpiracionMinutos=30
app.base-url=${APP_BASE_URL:http://localhost:8090}
