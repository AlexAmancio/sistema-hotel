server.port=8992

# Los secretos se leen de variables de entorno o del archivo .env (no se sube
# al repositorio; ver .env.example). Ningún secreto queda escrito en este archivo.
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=update
# Defecto D5: la aplicación ya no usa root. estadia_app solo tiene permisos
# sobre la base alquiler (se crea con scripts/crear-usuario-bd.sh).
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/alquiler}
spring.datasource.username=${DB_USER:estadia_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

security.login.maxAttempts=3
security.login.lockTimeMinutes=5

# Token de apiperu.dev para el autocompletado de datos por DNI. Se usa solo
# desde el servidor (nunca llega al navegador). Defecto D3: ya no tiene un
# valor de respaldo escrito aquí; sin APIPERU_TOKEN el autocompletado avisa
# que no pudo consultar y el cliente se registra a mano.
apiperu.token=${APIPERU_TOKEN:}

# Defecto D4: clave que firma la cookie de "Recuérdame". Si no se define, se
# genera una al azar en cada arranque (ver SecurityConfig).
security.remember-me.key=${REMEMBER_ME_KEY:}

# Defecto D11: datos del hotel en la cabecera del comprobante. El RUC solo se
# muestra si está configurado.
hotel.nombre=${HOTEL_NOMBRE:Tunki Lodge}
hotel.direccion=${HOTEL_DIRECCION:Oxapampa, Pasco - Perú}
hotel.ruc=${HOTEL_RUC:}

# Correo para "olvidé mi contraseña" (SMTP de Gmail con contraseña de aplicación).
# MAIL_USERNAME/MAIL_PASSWORD se setean como variables de entorno, nunca en este archivo.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Vigencia del enlace de recuperación de contraseña y URL base para armarlo.
security.reset.tokenExpiracionMinutos=30
app.base-url=${APP_BASE_URL:http://localhost:8090}
