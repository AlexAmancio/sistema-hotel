          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      # Cada prueba crea sus propios datos dentro de una transacción que se
      # deshace al terminar (como RefreshDatabase en Laravel); la base de
      # demostración aporta el esquema completo.
