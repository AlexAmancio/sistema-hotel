  integracion:
    name: Pruebas de integración (controlador + contexto Spring)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: alquiler
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      # Algunas pruebas de controlador resuelven el cliente y la habitación del
      # formulario contra la base de demostración, igual que en la máquina de
      # desarrollo. Se carga el mismo script versionado en el repositorio.
      - name: Cargar la base de demostración en MySQL
        run: mysql -h 127.0.0.1 -P 3306 -u root < bd/respaldo_bd_actual.sql

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set +e
          ./mvnw -B test -Dgroups=integracion | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $EXIT_CODE

      - name: Resumen de pruebas
