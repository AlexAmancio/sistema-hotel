name: pipeline-tests

# Cada job ejecuta un tipo de prueba según su etiqueta JUnit (@Tag):
#   unitaria    -> modelos y utilidades, sin Spring ni simulaciones
#   mockito     -> servicios con sus repositorios simulados
#   integracion -> controladores con MockMvc, seguridad real y MySQL
#   feature     -> pruebas feature al estilo de Laravel: cada ruta HTTP de la
#                  aplicación completa (sin simular capas propias) sobre MySQL,
#                  verificando respuesta, mensajes y filas en la base
#   aceptacion  -> escenarios BDD (Cucumber, Dado/Cuando/Entonces en español)
#                  escritos como los criterios de aceptación de las historias
# Filtrar por etiqueta (y no por una lista de clases) garantiza que toda prueba
# nueva entre al pipeline. El primer job además falla si alguna clase de prueba
# no tiene etiqueta.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unitarias:
    name: Pruebas unitarias puras
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Verificar que toda clase de prueba tenga etiqueta
        shell: bash
        run: |
          SIN_ETIQUETA=""
          for f in $(find src/test/java -name '*Test*.java' ! -name 'ControladorIntegracionBase.java' ! -name 'FeatureTestCase.java'); do
            if ! grep -qE '@Tag\("(unitaria|mockito|integracion|feature)"\)|extends ControladorIntegracionBase|extends FeatureTestCase|@IncludeEngines\("cucumber"\)' "$f"; then
              SIN_ETIQUETA="$SIN_ETIQUETA $f"
            fi
          done
          if [ -n "$SIN_ETIQUETA" ]; then
            echo "Estas clases de prueba no tienen @Tag y no correrían en ningún job:$SIN_ETIQUETA"
            exit 1
          fi
          echo "Todas las clases de prueba tienen etiqueta."

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set +e
          ./mvnw -B test -Dgroups=unitaria | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $EXIT_CODE

      - name: Resumen de pruebas
        if: always()
        shell: bash
        run: |
          SUMMARY_LINE=$(grep -E "^\[INFO\] Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$|^\[ERROR\] Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" test-output.txt | tail -1)
          RUN=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Tests run: )\d+' || true)
          FAILURES=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Failures: )\d+' || true)
          ERRORS=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Errors: )\d+' || true)
          SKIPPED=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Skipped: )\d+' || true)
          RUN=${RUN:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((RUN - FAILURES - ERRORS - SKIPPED))
          {
            echo "### Pruebas unitarias puras"
            echo ""
            echo '```'
            echo "Pruebas: $PASSED passed, $FAILURES failed, $ERRORS errors, $SKIPPED skipped (de $RUN totales)."
            echo '```'
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo ""
              echo "**Pruebas fallidas:**"
              grep -E "<<< FAILURE|<<< ERROR" test-output.txt || echo "(no se pudo listar el detalle, revisa el log completo)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

