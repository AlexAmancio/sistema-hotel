name: pipeline-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Ejecutar pruebas Spring Boot
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: alquiler
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        id: tests
        shell: bash
        run: |
          set +e
          ./mvnw test | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Resumen de pruebas
        if: always()
        shell: bash
        run: |
          SUMMARY_LINE=$(grep -E "^\[INFO\] Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" test-output.txt | tail -1)

          RUN=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Tests run: )\d+' || true)
          FAILURES=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Failures: )\d+' || true)
          ERRORS=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Errors: )\d+' || true)
          SKIPPED=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Skipped: )\d+' || true)
          RUN=${RUN:-0}
          FAILURES=${FAILURES:-0}
          ERRORS=${ERRORS:-0}
          SKIPPED=${SKIPPED:-0}
          PASSED=$((RUN - FAILURES - ERRORS - SKIPPED))

          {
            echo "### Resultado de las pruebas"
            echo ""
            echo '```'
            echo "Pruebas: $PASSED passed, $FAILURES failed, $ERRORS errors, $SKIPPED skipped (de $RUN totales)."
            echo '```'
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo ""
              echo "**Pruebas fallidas:**"
              grep -E "<<< FAILURE|<<< ERROR" test-output.txt || echo "(no se pudo listar el detalle, revisa el log completo)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
